[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-gateway-runtime"
version = "0.0.0"
description = "Gateway/Runtime split skeleton preserving OpenClaw run cancel/interrupt semantics"
requires-python = ">=3.11"
dependencies = [
  "websockets",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


