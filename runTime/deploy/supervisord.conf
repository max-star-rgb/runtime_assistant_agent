[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/supervisord.pid
user=root

[program:runtime]
command=python -m openclaw_gateway_runtime.runtime.ws_server
directory=/app
autorestart=true
startretries=999
startsecs=1
redirect_stderr=true
stdout_logfile=/app/logs/runtime.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:gateway]
command=python -m openclaw_gateway_runtime.gateway.ws_server
directory=/app
autorestart=true
startretries=999
startsecs=2
redirect_stderr=true
stdout_logfile=/app/logs/gateway.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
